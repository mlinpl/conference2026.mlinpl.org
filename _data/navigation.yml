          - name: "/ 2019"
            url: "https://conference2019.mlinpl.org"
          - name: "/ 2018"
            url: "https://conference2018.mlinpl.org"
          - name: "/ 2017"
            url: "https://conference2017.mlinpl.org"

  program:
    name: "/ Program"
    url: "#program"
    subsites:
      - name: "/ Agenda"
        url: "#agenda"
      - name: "/ Full program"
        url: "/program"
      - name: "/ Invited speakers"
