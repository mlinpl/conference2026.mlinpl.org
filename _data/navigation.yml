# Navigation is defined once under `items`, and `order` lists the explicit top-level ordering for each conference phase.

order:
  before-tickets:
    - about
    - program
    - timeline
    - call-for-sponsors
    - sponsors
    - organizers
  tickets:
    - tickets
    - about
    - program
    - timeline
    - call-for-sponsors
    - sponsors
    - organizers
  agenda-full:
    - program
    - tickets
    - about
    - timeline
    - sponsors
    - organizers
  after-conference:
    - about
    - tickets
    - program
    - timeline
    - sponsors
    - organizers

items:
  tickets:
    name: "/ Tickets"
    url: "#tickets"

  about:
