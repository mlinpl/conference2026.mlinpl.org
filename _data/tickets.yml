early-bird:
  name: "Early bird application"
  icon: "fa-solid fa-pen-to-square"
  description: |-
    Registration preceded by <strong>a selective application process</strong>, 
    open from 1&nbsp;June 
    until 31&nbsp;July, 23:59 (AOE).<br><br>
  prices:
    student: "350 PLN"
    regular: "700 PLN"
  price_label: "Early Bird Price"
  active: true
  visible: true
  url: "https://mlinpl2026earlybird.paperform.co/"

regular:
  name: "Regular registration"
  icon: "fa-solid fa-ticket"
  description: >-
    First-come, first-served registration, which starts 24&nbsp;August, 18:00 CEST (GMT+2) 
    and lasts until all tickets are sold out.
  prices:
    student: "500 PLN"
    regular: "1000 PLN"
  price_label: "Regular Price"
  active: false
  visible: true
  url:

