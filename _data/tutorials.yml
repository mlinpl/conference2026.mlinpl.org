  id: 7
  desc-md: |-
    In this tutorial, we will provide a brief introduction to reinforcement learning for code, discuss the infrastructure challenges involved, and demonstrate how to use our recently developed tool, IdeGYM — an orchestrator for RL rewards specifically designed for code-based tasks. During the tutorial, we will explore standard code-reward signals, such as execution and test-based feedback, as well as more advanced signals derived from IDE inspections.

