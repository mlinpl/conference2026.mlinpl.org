- title: 'Build Your Own 3D Scene: An Introduction to Gaussian Splatting'
  date: Sunday / 11 October
  time: TBA
  id: 2
  desc-md: |-
    Creating a digital 3D model of a real object or environment traditionally requires specialized equipment and knowledge of computer graphics. Recent machine learning methods make it possible to reconstruct detailed, interactive 3D scenes using only ordinary photographs or a short video.
    This hands-on workshop introduces participants to the complete 3D reconstruction pipeline using 3D Gaussian Splatting. It is designed for people familiar with basic machine learning concepts but with no previous experience in 3D reconstruction, neural rendering, or Gaussian Splatting.
    Participants will learn how images captured from different viewpoints can be used to estimate camera positions and create a scene that can be viewed from new perspectives. They will prepare a dataset from video, train a Gaussian Splatting model, and inspect the resulting reconstruction in an interactive viewer.
    The workshop will also cover selected topics that extend Gaussian Splatting beyond basic reconstruction, including scene editing, animation, appearance manipulation, and image-to-3D generation.
    By the end of the session, participants will understand the basic principles of modern image-based 3D reconstruction and will have practical experience creating and modifying their own 3D scene.

    **Goals of the tutorial:** Introduce the basic concepts of image-based 3D reconstruction, novel-view synthesis, and 3D Gaussian Splatting; explain the complete pipeline from video or image capture to an interactive 3D scene; provide practical experience with dataset preparation, Gaussian Splatting training, and scene visualization; teach participants how to identify common reconstruction problems and improve data acquisition and model quality; and demonstrate how Gaussian Splatting can be extended beyond reconstruction through editing, animation, generation, and scene understanding.

    **Prerequisites:** Bring a laptop and a computer mouse for convenient navigation in 3D viewers, and have basic Python programming skills.

