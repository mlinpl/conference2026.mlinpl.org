  author-bio-md: |-
    Patrik Bartak is a researcher at JetBrains Research, working on model evaluation and finetuning. He has used IdeGYM and other tools for reinforcement learning, and set up environments and scaffolds for evaluation of agentic models.

    Vseslav Kasatskii is a Software Engineer at JetBrains, building tools and infrastructure for research teams. He has contributed to IdeGYM and other projects that combine reinforcement learning workflows with agent evaluation, observability, and sandboxed execution.
