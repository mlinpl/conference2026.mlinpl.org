- name: Razvan Pascanu
  affiliation: Google DeepMind
  image: images/optimized/speakers-600x600/RazvanPascanu.webp
  bio-intro: >-
    Razvan Pascanu has been a research scientist at Google DeepMind since 2014. Before this, he completed his PhD at Universite de Montréal with prof. Yoshua Bengio, where he worked on understanding deep networks, specifically recurrent neural architectures. During his career he has made significant contributions to theory of deep networks, optimization, recurrent architectures as well as deep reinforcement learning, continual learning, meta-learning and graph neural networks. For details on his work please see razp.info. 
  bio-more: >-
    He has been Program Chair for the Neural Information Processing Systems (NeurIPS) conference and currently acts as General Chair, as well as a Program Chair for the Conference on Life-long Learning Agents (CoLLAs) and the Learning on Graphs Conference (LoG). He has organized various workshops on topics such as continual learning at top-tier conferences. He is also one of the main organizers of the Eastern European Machine Learning Summer School (EEML) and EEML workshop series, as well as an organizer of the Romanian AI Days.
  google-scholar: 
    https://scholar.google.com/citations?user=eSPY8LwAAAAJ&hl=en
  linkedin:
    https://www.linkedin.com/in/razvan-pascanu/

- name: Emanuele Rodolà
  affiliation: Sapienza University of Rome
  image: images/optimized/speakers-600x600/EmanueleRodola.webp
  bio-intro: >-
    Emanuele Rodolà is a Full Professor of Computer Science at Sapienza University of Rome, where he leads the GLADIA AI group. His work in this field has been supported by an ERC grant, a FIS grant, and a Google Research Award. In the past, he was a postdoctoral researcher at USI Lugano (2016–2017), an Alexander von Humboldt Fellow at TU Munich (2013–2016), and a JSPS Research Fellow at the University of Tokyo (2013), in addition to visiting periods at Tel Aviv University, Technion, École Polytechnique, and Stanford. He is a fellow of ELLIS and a fellow of the Young Academy of Europe. 
  bio-more: >-
    Professor Rodolà has received numerous awards for his research and plays an active role in the academic community, serving on program committees and as Area Chair for major conferences in AI and ML. His current research focuses primarily on neural model fusion, representation learning, language models, ML for audio, and multimodal learning, with around 190 publications in these areas. His work has been featured in media outlets including Fortune, Wired, Italian national broadcast and newspapers.

- name: Jakub Tomczak
  affiliation: Chan Zuckerberg Initiative
  image: images/optimized/speakers-600x600/JakubTomczak.webp
  bio-intro: >-
    Jakub Tomczak is a Generative AI leader with over 15 years of experience in machine learning, deep learning, and Generative AI. He has led extensive research across academia and industry, contributing three patents, over 50 publications in leading journals and at top conferences (including NeurIPS, ICML, ICLR, CVPR, ICCV, AISTATS), and securing EUR 2.3M in direct funding while contributing to consortia that have collectively obtained over EUR 100M. 
  bio-more: >-
    Jakub has managed teams for more than a decade and has served as a fractional AI leader for organizations such as eBay, Qualcomm, and multiple startups. He was Program Chair of NeurIPS 2024 and is the author of "Deep Generative Modeling", the first comprehensive book on Generative AI. He is also the founder of Amsterdam AI Solutions, and the head AI advisor at NatInLab.

- name: Piotr Sankowski
  affiliation: IDEAS Research Institute / University of Warsaw / ELLIS Unit Warsaw
  image: images/optimized/speakers-600x600/PiotrSankowski.webp
  bio-intro: >-
    Piotr Sankowski is a director of IDEAS Research Institute and a professor at the Institute of Computer Science at the University of Warsaw, where he received his habilitation in 2009 and his doctorate in computer science in 2005. His research interests include algorithmics, with a particular focus on algorithmic graph analysis and data analysis algorithms. 
  bio-more: >-
    In 2009, Piotr Sankowski received his doctorate in physics in the field of solid state theory at the Polish Academy of Sciences. He was the first Pole to receive four grants from the European Research Council (ERC): ERC Starting Independent Researcher Grant (2010), ERC Proof of Concept Grant (2015, 2023), ERC Consolidator Grant (2017). He is a co-founder of the Highlights of Algorithms conference. From 2021 to 2024, he was president of IDEAS NCBR, where he led the working group “Intelligent Algorithms and Data Structures.” He is co-founder and CSO of the spin-off MIM Solutions. He is a member of ELLIS Unit Warsaw with ELLIS Fellow status. Member of the Future Council and the UN Independent International Panel on AI.

- name: Adam Paszke
  affiliation: Google DeepMind
  image: images/optimized/speakers-600x600/AdamPaszke.webp
  bio-intro: >-
    Adam Paszke is a co-creator of PyTorch, an open-source framework widely used across the machine learning community, and an alumnus of the University of Warsaw. Throughout his career, he has focused on designing software abstractions and languages for ML modeling on heterogeneous accelerators, at scales large and small. 
  bio-more: >-
    Today, Adam is a research scientist at Google DeepMind, where his work centers on Pallas and JAX with the goal of making GPU and TPU performance engineering productive. This work is entirely open-source, continuing his long-standing dedication to open systems and infrastructure.


- name: Bartosz Piotrowski
  affiliation: Axiom Math
  image: images/optimized/speakers-600x600/BartoszPiotrowski.webp
  bio-intro: >-
    Bartosz Piotrowski is a Member of Technical Staff at Axiom Math, a Silicon Valley–based startup building verifiable AI. He is passionate about combining machine learning with symbolic reasoning techniques. In 2023, he defended his PhD thesis on this topic at Radboud University Nijmegen in the Netherlands.
  bio-more: >-
    Previously, he worked with the Automated Reasoning Group at the Czech Technical University, was a visiting researcher at Carnegie Mellon University, and held postdoctoral research positions at the IDEAS Institute in Warsaw, Poland, and at Meta FAIR in New York. In addition, Bartosz has a background in mathematics and philosophy.

- name: Valentina Boeva
  affiliation: ETH Zurich
  image: images/optimized/speakers-600x600/ValentinaBoeva.webp
  bio-intro: >-
    Dr. Valentina Boeva is a Tenure Track Assistant Professor at the Department of Computer Science, ETH Zurich, where she leads the Computational Cancer Genomics Group. Her research focuses on developing computational methods for multi-omics data integration to understand the epigenetic and transcriptional plasticity of cancer cells. 
  bio-more: >-
    Before joining ETH Zurich in 2019, Prof. Boeva led the Computational Epigenetics of Cancer laboratory at Inserm's Cochin Institute in Paris. She holds a Ph.D. in Bioengineering and Bioinformatics from Lomonosov Moscow State University. Throughout her career, Prof. Boeva has made contributions to the field of computational cancer genomics by developing methods for the analysis of DNA sequencing data, bulk and single-cell transcriptomics and epigenomics data, and, recently, spatial transcriptomics and proteomics.

