  author-bio-md: |-
    Kseniia Lysaniuk is a Machine Learning Engineer at JetBrains. Her work spans model evaluation and training data research, including contributions to Mellum2.

    Petr Borovlev is a Machine Learning Engineer at JetBrains, working on large language models with a focus on pre-training, architecture, and infrastructure. He contributed to Mellum2 and its tokenizer, exploring how tokenization choices affect the efficiency and behavior of language models.

- title: "Scaling AI: From Chip to Galaxy to Cluster"
  abstract-md: |-
    Tenstorrent produces AI hardware for running models at all scales. The hardware is infinitely scalable around a single building block: the Galaxy machine, a fully general AI computer. Galaxy systems are affordable because they use standard Ethernet for communication and DRAM for storage, while ample on-chip SRAM and efficient data movement enable high performance. We will describe how multiple Galaxies can be connected to serve models of any size with high efficiency. As an example, we will show how Galaxy systems can serve video generation inference at speeds unavailable on other systems, enabling interactive video generation in real time.
  date: Friday / 9 October
  time: 16:15 - 17:15
  room: Main Hall
  id: 5
  authors:
    - name: Bazyli Klockiewicz
      title: Tenstorrent
      image: images/optimized/sponsor-speakers-600x600/BazyliKlockiewicz.webp
    - name: Daniil Yurshevich
