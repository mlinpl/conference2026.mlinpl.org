- title: "BDH: The Missing Link between the Transformer and Models of the Brain"
  abstract-md: |-
    We introduce Dragon Hatchling (BDH), a new large language model architecture inspired by scale-free biological networks. BDH shows how attention can emerge from local, graph-based neuron interactions rather than centralized matrix multiplications. On one hand, BDH behaves like a brain-like, decentralized system where computation lives on synapses adjusted through Hebbian learning. On the other, it offers a dual, GPU-friendly implementation that empirically matches the performance of GPT-style Transformers. This duality makes BDH both performant and interpretable: reasoning in BDH arises from explicit local graph dynamics with well-defined limit behavior. Latent space in BDH is large, sparse and non-negative. It can be directly interpreted as activations of a large neuron population, enabling mechanistic interpretability (we show emergence of monosemanticity) and stable encoding of concepts which simplifies learning relations across time. In fact the model demonstrates rudimentary language processing capabilities even when trained without backpropagation through time.

    Associated paper: [https://arxiv.org/abs/2509.26507](https://arxiv.org/abs/2509.26507)
  date: Friday / 9 October
  time: 16:15 - 17:15
  room: Hall B
  id: 7
  authors:
    - name: Jan Chorowski
      title: Pathway
      image: images/optimized/sponsor-speakers-600x600/JanChorowski.webp
  author-bio-md: |-
    Jan Chorowski is the Chief Technology Officer and co-founder of Pathway, where he oversees the engineering direction of the company’s AI architecture. A pioneer in neural network models, Chorowski was the first person to apply attention in speech recognition. His research — including collaborations with Geoffrey Hinton and Yoshua Bengio — has been cited more than 13,000 times and helped shape the field of sequence-to-sequence learning. Before co-founding Pathway, he held research and engineering roles at Google Brain and MILA. At Pathway, Chorowski ensures that the company’s research breakthroughs are translated into scalable systems capable of reasoning, adapting, and learning continuously in real-world environments. Co-author of the BDH architecture.

- title: "The multimodal representation problem"
  abstract-md: |-
    Multimodal systems aim to unify understanding and generation, but these tasks often need different representations. Understanding benefits from semantic features, while generation requires fine-grained detail. This talk explores this tension and how recent models address it, with examples from audio and vision.
  date: Saturday / 10 October
  time: 14:30 - 15:30
  room: Main Hall
  id: 8
  authors:
    - name: Hubert Siuzdak
      title: ElevenLabs
      image: images/optimized/sponsor-speakers-600x600/HubertSiuzdak.webp
  author-bio-md: |-
    Hubert Siuzdak is a researcher at ElevenLabs. His research focuses on neural audio codecs, vocoders, learned representations, and generative modeling for speech and audio. His academic background is in acoustical engineering and computer science at AGH University of Krakow.

- title: "Autoresearch: Can an LLM Agent Improve Real-Time Bidding Models?"
  abstract-md: |-
    In this talk, we present our ongoing work on Autoresearch: a system where LLM agents autonomously optimize production machine learning models we use for real-time bidding at RTB House. The agents analyze experiment results, propose hypotheses, modify training code and launch new training runs – all in an isolated sandbox environment, without human involvement. We will describe how the system evolved from a simple agent loop into a structured multi-agent pipeline, and why we built our own framework instead of adopting existing tools. Finally, we will share challenges of running agents unattended for weeks: objective specification, metric guardrails, and observability.
  date: Saturday / 10 October
  time: 14:30 - 15:30
  room: Hall A
  id: 9
  authors:
    - name: Krzysztof Spaliński
      title: RTB House
      image: images/optimized/sponsor-speakers-600x600/KrzysztofSpalinski.webp
  author-bio-md: |-
    Krzysztof is a Machine Learning Researcher at RTB House, working on bidding models and, more recently, on autonomous ML research. He holds an MEng in Data Science from the Warsaw University of Technology and a BSc in Mathematics from the University of Warsaw.

- title: "Building Document Intelligence: How Dropbox Sign Automates Field Placement"
  abstract-md: |-
    A form document might look obvious to a person. Sign here. Add a date there. Teaching an AI system to understand those same cues reliably and at scale is much harder.

    We set out to remove one of the most repetitive parts of preparing documents for signature: manually finding, placing, and sizing every field. Getting there meant experimenting across computer vision, text, layout, document semantics, and user behavior.

    Dropbox Sign encountered that challenge while building an AI system to automate field placement for electronic signatures. What looked like a document vision problem quickly became a challenge spanning language, spatial relationships, semantics, and intent.

    This talk explores how we turned that ambiguity into a production system. We’ll unpack the experiments that shaped our approach, the trade-offs behind a modular architecture, and how latency, privacy, and reliability influenced the solution.
  date: Saturday / 10 October
  time: 14:30 - 15:30
  room: Hall B
  id: 10
  authors:
    - name: Jan Doliński
      title: Dropbox
      image: images/optimized/sponsor-speakers-600x600/JanDolinski.webp
  author-bio-md: |-
    Jan is a Software Engineer at Dropbox, where he leads the end-to-end delivery of AI features for Dropbox Sign, taking intelligent capabilities from early concepts all the way to production. With a strong background in senior engineering and tech lead roles, Jan specializes in bridging intuitive user experiences with scalable technical architecture. He is passionate about the practical realities of shipping AI in the real world, focusing on iterative feedback loops and product-driven engineering. Outside of work, Jan continuously expands his ML knowledge and is an avid car enthusiast.
