- title: "BTS: Story of the Neural Ranking Model Lifecycle at Allegro"
  abstract-md: |-
    In this talk, we dive into Allegro's ML ranking lifecycle to address the gap between offline training and online model serving. We share the story of a pipeline that silently failed a year post-launch, illustrating what goes wrong when teams rely on trust rather than automated validation. We discuss our detective work to resolve these failures and how those lessons reshaped our entire online-offline lifecycle processes. You will leave with an awareness of the subtle silos that can emerge when moving ML systems to production, and ideas on how to avoid our mistakes in your own workflows.
  date: Thursday / 8 October
  time: 15:30 - 16:30
  room: Main Hall
  id: 1
  authors:
    - name: Eliška Kosturová
      title: Allegro
