  author-bio-md: |-
    Bazyli is a Senior Staff Engineer at Tenstorrent, where he designs and optimizes the systems that make large AI models run efficiently, from low-level accelerator kernels to distributed training and inference. He also serves as Site Lead for the company's Polish branch. He holds a PhD in Computational and Mathematical Engineering from Stanford University.

    Daniil is a Senior Engineer at Tenstorrent, where he develops training and inference workflows for LLMs at different scales. He studied theoretical mathematics and computer science at Jagiellonian University before completing a master's in mathematics at EPFL, where he also conducted research on reinforcement learning and mechanistic interpretability in the Data Science Lab.

- title: "From Anomaly Detection to Autonomous Action: Bridging ML Analytics and Agentic AI in Sovereign Telecom Networks"
  abstract-md: |-
    Modern telecommunications networks generate billions of events daily, requiring high-precision analytics and strict data sovereignty. Machine Learning forms the foundation of network operations, providing real-time time-series forecasting, anomaly detection, and Root Cause Analysis (RCA) across Fault and Performance Management systems. Building upon these core analytical capabilities, the next evolution lies in connecting ML-driven insights with multi-agent orchestration to achieve closed-loop automation.

    In this session, we present the architecture of the Comarch OSS AI/ML Platform—a hybrid, sovereign ecosystem designed to bridge predictive ML with Agentic AI. We will discuss how production ML pipelines generate the critical operational triggers that feed directly into multi-agent workflows. Using standardized context sharing via the Model Context Protocol (MCP), AI agents interpret ML outputs, reason over network topology, and safely orchestrate remediation paths. Join us to explore how combining deterministic ML precision with Agentic AI reasoning establishes a practical foundation for autonomous telecom operations.
  date: Friday / 9 October
  time: 16:15 - 17:15
