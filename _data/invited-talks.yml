- author-name: Adam Paszke
  title: "Ten Years of ML Systems: PyTorch, JAX, Pallas, and What's Next"
  author-title: "Google DeepMind"
  abstract-md: |-
    Over the last decade, machine learning systems have experienced multiple paradigm shifts. Rapidly evolving model architectures and hardware have constantly changed what we optimize for, from enhancing developer productivity towards scale-up and mechanical sympathy. In this talk I'll share my lessons from building these systems and the practical design decisions behind each step, highlight where we are today, and finally discuss how another shift in our priorities and abstractions has already begun.
  author-bio: |-
    Adam Paszke is a co-creator of PyTorch, an open-source framework widely used across the machine learning community, and an alumnus of the University of Warsaw. Throughout his career, he has focused on designing software abstractions and languages for ML modeling on heterogeneous accelerators, at scales large and small.

    Today, Adam is a research scientist at Google DeepMind, where his work centers on Pallas and JAX with the goal of making GPU and TPU performance engineering productive. This work is entirely open-source, continuing his long-standing dedication to open systems and infrastructure.
  date: Thursday / 8 October
  time: 17:00 - 18:00
  room: Hall A
  id: 4
