- author-name: Paweł Budzianowski
  title: "Supervising Physical AI"
  author-title: "Lute"
  abstract-md: |-
    Physical intelligence is rapidly improving robotics capabilities. Vision-language-action models and world models benefit from pre-training on general video corpora, enabling greater generalization capabilities. However, further improvements in performance still require human intervention, even with policies reaching a 99.99% success rate. We will discuss how temporal prediction and reward models enable automatic supervision and how general VLMs will eventually take over the handling of end-to-end deployments.
  author-bio: |-
    Paweł Budzianowski is the co-founder and CEO of Lute, which builds the next frontier of physical intelligence. He previously co-founded K-Scale Labs, which produced affordable open-source humanoid robots to democratize embodied AI, and led the ML team at PolyAI. He holds a PhD from Cambridge, where he worked on long-term conversational agents, and created and co-lectured the joint NLP course for the ML master's programs at Warsaw University and Jagiellonian University.
