- author-name: Tomáš Pluskal
  title: "Decoding the chemical universe of plants"
  author-title: "IOCB Prague"
  abstract-md: |-
    Plants are an incredibly rich source of pharmaceutically relevant specialized metabolites (small molecules). However, deciphering the biochemistry that occurs in non-model plant species is a highly challenging task. My lab is developing generalized computational workflows for connecting biosynthetic gene sequences (obtained using RNA sequencing) to their downstream metabolites (detected using mass spectrometry). To this end, we have developed EnzymeExplorer, a targeted machine learning pipeline for predicting the enzymatic functions of terpene synthases directly from their amino acid sequences (Samusevich et al, bioRxiv 2025) and DreaMS, a self-supervised foundation machine learning model for tandem mass spectrometry, which outperforms state-of-the-art methods in a range of different prediction tasks (Bushuiev et al., Nature Biotechnology 2025). We are further building on these foundations towards the final goal: a full computational characterization of the chemodiversity and biosynthetic potential of each plant species using easy-to-obtain experimental datasets.
  author-bio: |-
    Tomáš Pluskal is a group leader at IOCB Prague, where he heads the Biochemistry of Plant Specialized Metabolites research group (www.pluskal-lab.org). Building on his Ph.D. training from the Okinawa Institute of Science and Technology and a postdoctoral fellowship conducted at the Whitehead Institute for Biomedical Research, he develops new computational and biochemical approaches to discover, characterize, and synthesize bioactive plant molecules.

    He co-authored the widely used metabolomics software platform mzmine and recently introduced the AI-driven DreaMS model for identifying unknown compounds from mass spectrometry data. Tomáš is a recipient of the Neuron Award for Promising Scientists and an ERC Consolidator Grant, is a member of the EMBO Young Investigator Programme, and serves as a board member of the international Metabolomics Society.
  date: Saturday / 10 October
  time: 11:15 - 12:15
  room: Hall A
  id: 11
  author-image: images/optimized/invited-speakers-600x600/TomasPluskal.webp

- author-name: João F. Henriques
  title: "Blurring the lines between synthetic and real data for 3D vision"
  author-title: "University of Oxford"
  abstract-md: |-
    Machine learning thrives whenever data is plentiful, but 3D vision remains a stubborn exception. The reason is that cameras capture only flat images, so recovering and labelling the 3D scene behind them is slow and expensive - especially when people are moving. Simulators offer a tempting way out, as they provide perfect 3D labels for free; yet models trained on simulated data often struggle in the real world.

    In this talk I'll suggest that large pretrained models for 2D vision can change this picture by blurring the line between synthetic and real data. I'll describe two recent projects that cross the gap from opposite directions. One makes synthetic data look real, using diffusion models to generate photorealistic people with exact 3D labels. The other makes real data look synthetic, letting a model trained purely in simulation reconstruct uncalibrated broadcast rugby in full 3D. I'll close with some lessons that may carry over to other fields where ground truth is scarce but simulators are not.
  author-bio: |-
    Dr. João Henriques is an Associated Faculty at the Visual Geometry Group (VGG), University of Oxford. His research focuses on computer vision and robotics, with the goal of making machines more perceptive and intelligent. He created the KCF and SiameseFC visual object trackers, which won the highly competitive VOT Challenge twice, and are widely deployed in consumer hardware, from social media apps to commercial drones.

    His research spans many topics: 3D video understanding, robot mapping and navigation, agentic and safe AI; as well as various forms of learning, from self-supervised, causal, and reinforcement learning, including optimisation theory.
  date: Saturday / 10 October
  time: 16:00 - 17:00
  room: Main Hall
  id: 12
  author-image: images/optimized/invited-speakers-600x600/JoaoFHenriques.webp

- author-name: Johannes von Oswald
  title: "Retrieval-Centric Deep Learning: Replacing Weight Matrices with Vector Databases"
  author-title: "Google / Paradigms of Intelligence Team"
  abstract-md: |-
    The deep learning models powering our current AI revolution are built on parameter matrices that form linear layers. These essential components dictate a learning system's capacity, as well as its computational and memory requirements during training and inference.

    In this talk, I will first highlight that linear layers trained by gradient descent can be expressed as key-value memory systems, storing inputs as keys and their corresponding output gradients as values (Irie et al., 2022). This creates a direct connection between gradient-descent trained linear layers and popular sequence layers that learn in-context, such as Mamba or Gated DeltaNet. Consequently, this duality motivates a gradient-descent-based linear layer counterpart to softmax self-attention.

    Second, leveraging this duality, I will present both historically overlooked and novel "growing" retrieval-centric layers. These provide a principled drop-in replacement for standard linear layers by storing (roughly) inputs and output gradients in a database, recalling them using non-linear attention.

    Finally, I will share ongoing empirical results that highlight the practical challenges and promising future directions of this new paradigm in retrieval-centric deep learning.
  author-bio: |-
    Johannes von Oswald is a research scientist at Google in Zurich, working with Blaise Agüera y Arcas and João Sacramento in the Paradigms of Intelligence Team. Until 2023, he was a PhD student supervised by Angelika Steger and João Sacramento at the Institute of Theoretical Computer Science, ETH Zurich.
    His research focuses on how and what machines, in particular neural networks, learn from data. One important goal is to allow these learning algorithms to generalize broadly and solve novel complex tasks. Therefore, he is heavily inspired by (meta-) learning within a large, possibly open-ended, environment.

    Currently, he investigates how state-of-the-art neural network models, in particular transformer-based large language models, can move beyond pattern matching to learn and implement algorithmic-like solutions. This led him to work on mesa-optimization: the emergence of optimization algorithms within neural networks! In recent work, he showed that gradient descent-based algorithms can be implemented within the activations of transformers by simple autoregressive outer-optimization. This allows transformers to learn and generalize at test time to novel data provided in-context. This led to the development of a novel recurrent neural network architecture, the MesaNet, which was layer on tested on language modeling at scale.
  date: Saturday / 10 October
  time: 16:00 - 17:00
  room: Hall A
  id: 13
  author-image: images/optimized/invited-speakers-600x600/JohannesVonOswald.webp

- author-name: Stanisław Jastrzębski
  title: "The first near-autonomous discovery in organic chemistry made by OpenAI and Molecule.one"
  author-title: "Molecule.one"
  abstract-md: |-
    In the first part of the talk, I will discuss the recent collaboration between Molecule.one and OpenAI that led to a near-autonomous discovery in organic chemistry. Over three months, our system planned, carried out, and analyzed more than 10,000 Chan–Lam coupling reactions with minimal human oversight. Among its findings, it identified TEMPO as a particularly effective additive (oxidant)—a result that surprised human experts. Through the lens of this project, we will explore what the increasing automation of the scientific process means for us — as AI scientists and engineers.
  author-bio: |-
    Stan is a scientist-founder and Co-Founder, CTO and Chief Scientist at Molecule.one. He is building Maria, a platform for autonomous scientific discovery in organic chemistry, recently used in a collaboration with OpenAI on near-autonomous chemical discovery. He completed his postdoctoral research at New York University and earned a PhD at Jagiellonian University.

    He has co-authored highly cited work on the foundations of deep learning with collaborators at Mila, including Yoshua Bengio, and at Google Research. He serves as an Action Editor for TMLR and regularly as an Area Chair for leading ML conferences, including ICLR 2026. He is also a Venture Partner at Expeditions Fund.
  date: Saturday / 10 October
  time: 16:00 - 17:00
  room: Hall B
  id: 14
  author-image: images/optimized/invited-speakers-600x600/StanislawJastrzebski.webp
