- author-name: Lenka Zdeborová
  title: "Machine Learning Theory in the Age of Attention"
  author-title: "EPFL"
  abstract-md: |-
    Modern machine learning systems rely on architectures and mechanisms that go beyond the classical models at the heart of much of learning theory. In this talk, I will discuss how solvable high-dimensional models can provide a framework for studying these systems while retaining enough structure to expose their underlying mechanisms. I will focus in particular on attention-based architectures. By analyzing simplified models of attention, we can derive their learning dynamics and identify phase transitions, scaling laws, and mechanisms of representation and specialization. I will argue that such models offer a complementary route to understanding modern machine learning: not by reproducing the complexity of current systems, but by constructing tractable settings in which their essential phenomena can be made explicit.
  author-bio: |-
    Lenka Zdeborová is a Professor of Physics and Computer Science at École Polytechnique Fédérale de Lausanne, where she leads the Statistical Physics of Computation Laboratory. She received a PhD in physics from the University of Paris-Sud and Charles University in Prague in 2008. She spent two years in the Los Alamos National Laboratory as the Director's Postdoctoral Fellow.

    Between 2010 and 2020, she was a researcher at CNRS, working in the Institute of Theoretical Physics in CEA Saclay, France. In 2014, she was awarded the CNRS bronze medal, in 2016 Philippe Meyer prize in theoretical physics and an ERC Starting Grant, in 2018 the Irène Joliot-Curie prize, in 2021 the Gibbs lectureship of AMS and the Neuron Fund award, in 2025 she received an ERC Advanced Grant. Lenka's expertise is in the application of concepts from statistical physics, such as advanced mean field methods, the replica method, and related message-passing algorithms, to problems in machine learning, signal processing, inference, and optimization. Currently, she focuses on statistical physics of learning, developing solvable models and theoretical principles that explain how modern AI systems generalize, memorize, and scale. She enjoys erasing the boundaries between theoretical physics, mathematics and computer science.
  date: Friday / 9 October
  time: 11:15 - 12:15
  room: Hall A
  id: 6
