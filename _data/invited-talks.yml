- author-name: Valentina Boeva
  title: "Transformer-based foundation models for molecular cancer research"
  author-title: "ETH Zurich"
  abstract-md: |-
    Over the past few years, the transformer architecture has moved from natural language processing into molecular biology, where large models pretrained on millions of transcriptomes, genomes, and protein sequences are now proposed as general-purpose substrates for downstream biomedical tasks. This talk is an introduction to transcriptomics models and what they can plausibly do for cancer research today. I will begin with the general approach of modeling single cells by training foundation models on large corpora of single-cell RNA-seq data. The second part turns to cancer-specific modeling. Using CancerFoundation, a model trained exclusively on malignant cells, I will illustrate the case for focused rather than maximally large models, and show applications to zero-shot batch integration and drug response prediction for unseen cell lines and compounds. The third part will address interpretability. I will present recent work applying sparse autoencoders to the hidden representations of single-cell foundation models, which reveals disentangled biological and technical features that can be intervened upon, offering a route from black-box embeddings to mechanistic understanding and to the removal of unwanted technical signal. Finally, I will look ahead to architectural directions likely to matter for biology, in particular looped and fixed-point transformers that allocate test-time compute adaptively to the difficulty of a problem.
  author-bio: |-
    Dr. Valentina Boeva is a Tenure Track Assistant Professor at the Department of Computer Science, ETH Zurich, where she leads the Computational Cancer Genomics Group. Her research focuses on developing computational methods for multi-omics data integration to understand the epigenetic and transcriptional plasticity of cancer cells.

    Before joining ETH Zurich in 2019, Prof. Boeva led the Computational Epigenetics of Cancer laboratory at Inserm's Cochin Institute in Paris. She holds a Ph.D. in Bioengineering and Bioinformatics from Lomonosov Moscow State University. Throughout her career, Prof. Boeva has made contributions to the field of computational cancer genomics by developing methods for the analysis of DNA sequencing data, bulk and single-cell transcriptomics and epigenomics data, and, recently, spatial transcriptomics and proteomics.
  date: Friday / 9 October
  time: 17:30 - 18:30
  room: Hall A
  id: 9
