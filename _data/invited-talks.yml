- author-name: Peter Richtárik
  title: "The Broximal Point Method and Its Impact on Optimization Theory and Machine Learning"
  author-title: "KAUST"
  abstract-md: |-
    The Broximal Point Method (BPM) of Gruntkowska, Li, Rane, and Richtárik, related to the ball-oracle work of Carmon, Sidford, et al., replaces the quadratic penalty of the classical proximal point method with a ball constraint. In the nonsmooth convex regime it converges linearly and in finitely many steps, without dependence on any condition number. I will focus on the basic results described in Gruntkowska et al., then briefly cover four extensions: a non-Euclidean theory that makes BPM a blueprint for geometry-aware methods; Broximal Alignment, a condition under which BPM finds a global minimizer with no smoothness or Lipschitz assumption; Local LMO, which applies a linear minimization oracle on the constraint set intersected with a local ball and recovers gradient-descent rates without projections; and distributed Brox (new results; not yet online).

    BPM itself is a conceptual method. What makes it useful in machine learning is approximation: apply Brox to a stochastic linear model of the objective, approximately, under a specific non-Euclidean norm. That construction is Muon (and its relatives). I will sketch this link and our follow-up work on theory of this family.

    **Ball oracles**

    - Carmon, Jambulapati, Jiang, Jin, Lee, Sidford, Tian, Acceleration with a ball optimization oracle, NeurIPS 2020.

    **Brox / BPM**

    - Gruntkowska, Li, Rane, Richtárik, The ball-proximal ("broximal") point method, [arXiv:2502.02002](https://arxiv.org/abs/2502.02002).
    - Gruntkowska, Richtárik, Non-Euclidean broximal point method, [arXiv:2510.00823](https://arxiv.org/abs/2510.00823).
    - Gruntkowska, Li, Qian, Richtárik, Broximal alignment for global non-convex optimization, [arXiv:2604.13483](https://arxiv.org/abs/2604.13483).
    - Richtárik, Gruntkowska, Li, Local LMO, [arXiv:2605.08850](https://arxiv.org/abs/2605.08850).

    **Muon / LMO**

    - Jordan, Jin, Boza, You, Cesista, Newhouse, Bernstein, Muon: an optimizer for hidden layers in neural networks, 2024.
    - Riabinin, Shulgin, Gruntkowska, Richtárik, From Muon to Gluon, ICML 2026, [arXiv:2505.13416](https://arxiv.org/abs/2505.13416).
    - Gruntkowska, Gaponov, Tovmasyan, Richtárik, Error feedback for Muon and friends, ICLR 2026, [arXiv:2510.00643](https://arxiv.org/abs/2510.00643).
    - Gruntkowska, Maziane, Qu, Richtárik, Drop-Muon, [arXiv:2510.02239](https://arxiv.org/abs/2510.02239).
    - Qian, Rammal, Kovalev, Richtárik, Muon is provably faster with momentum variance reduction, [arXiv:2512.16598](https://arxiv.org/abs/2512.16598).
    - Khirirat, Sadiev, Demidovich, Richtárik, Better LMO-based momentum methods with second-order information, [arXiv:2512.13227](https://arxiv.org/abs/2512.13227).
    - Qian, Gaponov, Malinovsky, Richtárik, Communication-efficient Gluon in federated learning, [arXiv:2604.10689](https://arxiv.org/abs/2604.10689).
    - Demidovich, Chakraborty, Malinovsky, Nedić, Richtárik, Distance-aware Muon, [arXiv:2605.18999](https://arxiv.org/abs/2605.18999).
    - Qian, Richtárik, Convergence analysis of Muon-type methods with inexact LMO in the degenerate case, [arXiv:2606.21581](https://arxiv.org/abs/2606.21581).
    - Shulgin, Awad, Richtárik, Gorbunov, General analysis of LMO-based optimizers, ICML 2026.
  author-bio: |-
    Peter Richtárik is a professor of Computer Science at the King Abdullah University of Science and Technology (KAUST), Saudi Arabia, where he leads the Optimization and Machine Learning Lab. His research interests lie at the intersection of mathematics, computer science, machine learning, optimization, numerical linear algebra, and high-performance computing. Through his work on randomized and distributed optimization algorithms, he has contributed to the foundations of machine learning, optimization and randomized numerical linear algebra. He is one of the original developers of Federated Learning.

    Prof Richtárik’s works attracted international awards, including the Charles Broyden Prize, SIAM SIGEST Best Paper Award, Distinguished Speaker Award at the 2019 International Conference on Continuous Optimization, the IMA Leslie Fox Prize (three times), and a Best Paper Award at the NeurIPS 2020 Workshop on Scalability, Privacy, and Security in Federated Learning. Several of his works are among the most read papers published by the SIAM Journal on Optimization and the SIAM Journal on Matrix Analysis and Applications. Prof Richtárik serves as an Area Chair for leading machine learning conferences, including NeurIPS, ICML and ICLR, and is an Action Editor of JMLR, and Associate Editor of Numerische Mathematik and Optimization Methods and Software. In the past, he served as an Action Editor of TMLR and an Area Editor of JOTA.
