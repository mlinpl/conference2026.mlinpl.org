- author-name: Razvan Pascanu
  title: "Is the reliance on scale unavoidable?"
  author-title: "Mila / Google DeepMind"
  abstract-md: |-
    In this talk I will investigate the importance of scale in building modern ML systems. The main hypothesis put forward is that the heavy reliance on scale is likely unsustainable; therefore, a natural question is whether alternatives exist. To this end I explore the role of gradient interference in representation building, and argue for its dual role in learning: it slows down learning and implicitly prevents small models from converging to good solutions, while also serving as the main mechanism for discovering structure in data. I will frame continual learning as an attempt to resolve some of these contradictions, exposing some of the basic phenomena that make sequential learning hard, in particular catastrophic forgetting, feature identification and co-observation. The talk itself is not aiming at providing a working solution or an answer, but rather exposing the difficulties of removing the reliance on scale, the open problems and our current understanding of them. The hope is that this will outline a possible frontier for future development in the field.
  author-bio: |-
    Razvan Pascanu has been a research scientist at Google DeepMind since 2014. Before this, he completed his PhD at Universite de Montréal with prof. Yoshua Bengio, where he worked on understanding deep networks, specifically recurrent neural architectures. During his career he has made significant contributions to theory of deep networks, optimization, recurrent architectures as well as deep reinforcement learning, continual learning, meta-learning and graph neural networks. For details on his work please see razp.info.

    He has been Program Chair for the Neural Information Processing Systems (NeurIPS) conference and currently acts as General Chair, as well as a Program Chair for the Conference on Life-long Learning Agents (CoLLAs) and the Learning on Graphs Conference (LoG). He has organized various workshops on topics such as continual learning at top-tier conferences. He is also one of the main organizers of the Eastern European Machine Learning Summer School (EEML) and EEML workshop series, as well as an organizer of the Romanian AI Days.
  date: Thursday / 8 October
  time: 12:15 - 13:15
  room: Main Hall
  id: 1
  author-image: images/optimized/invited-speakers-600x600/RazvanPascanu.webp

- author-name: Piotr Sankowski
  title: "Global AI Governance from the Inside of UN AI Panel"
  author-title: "IDEAS Research Institute / University of Warsaw"
  abstract-md: |-
    Artificial Intelligence is evolving at an unprecedented pace, shifting from narrow applications to frontier models with truly transformative potential. While this rapid acceleration brings immense opportunities for scientific and economic progress, it also introduces critical challenges - ranging from the extreme concentration of computational power and market dominance, to the risks of unaligned systems and societal disruption.

    As these technologies inherently transcend borders, national regulations alone are insufficient. How do we build a cohesive global framework? Drawing on firsthand experience and discussions from the Independent International Scientific UN Panel on AI, this talk provides an exclusive, insider’s perspective on the current state of global AI governance. We will explore the ongoing international debates, and the profound complexities of aligning diverse geopolitical interests to ensure AI benefits humanity as a whole.

    Please note: To facilitate an open and candid discussion, this talk will not be recorded, and the presentation slides will not be made available afterward.
  author-bio: |-
    Piotr Sankowski is a director of IDEAS Research Institute and a professor at the Institute of Computer Science at the University of Warsaw, where he received his habilitation in 2009 and his doctorate in computer science in 2005. His research interests include algorithmics, with a particular focus on algorithmic graph analysis and data analysis algorithms.

    In 2009, Piotr Sankowski received his doctorate in physics in the field of solid state theory at the Polish Academy of Sciences. He was the first Pole to receive four grants from the European Research Council (ERC): ERC Starting Independent Researcher Grant (2010), ERC Proof of Concept Grant (2015, 2023), ERC Consolidator Grant (2017). He is a co-founder of the Highlights of Algorithms conference. From 2021 to 2024, he was president of IDEAS NCBR, where he led the working group “Intelligent Algorithms and Data Structures.” He is co-founder and CSO of the spin-off MIM Solutions. He is a member of ELLIS Unit Warsaw with ELLIS Fellow status. Member of the Future Council and the UN Independent International Panel on AI.
  date: Thursday / 8 October
  time: 12:15 - 13:15
  room: Hall A
  id: 2
