- author-name: Pierre Stock
  title: "Deep Dive Mistral. Scalable and agentic AI: co-developing scaffolds & models hand-in-hand"
  author-title: "Mistral"
  abstract-md: |-
    As we have scaled parameters, data, and compute to trillions, the model alone is still not enough to build capable agents. This talk walks through the full training pipeline (pre-training, supervised fine-tuning, and reinforcement learning), explaining how models learn tool use, adapt to new domains, and develop "thinking traces" that enable reasoning, error recovery, transparency, and control. Then, the focus turns to the harness: tools, memory, orchestration, guardrails, and context management built around a stateless model, with "skills" as versioned, human- and agent-editable external memory that lets agents learn without retraining. These ideas are illustrated with a running example of an agent diagnosing crop stress and planning irrigation. The conclusion puts forth an outlook on increasing agent autonomy and the evolving role of humans in the loop.
  author-bio: |-
    Pierre Stock is VP Science, driving Mistral's model releases, roadmap strategy and execution. Pierre holds a Master's degree in Mathematics Vision Learning from Paris Saclay and began his career at Facebook AI Research (FAIR) in 2017. At FAIR, he completed his PhD exploring efficiency and redundancy in LLMs, in collaboration with ENS de Lyon until 2021. He then continued his career at Meta before joining Mistral as the first employee.
  date: Thursday / 8 October
  time: 17:00 - 18:00
  room: Main Hall
  id: 3
