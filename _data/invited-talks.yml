- author-name: Markus Wulfmeier
  title: "Mastery-first Physical AI - Demos, Deployment, Open Questions"
  author-title: "Nomagic"
  abstract-md: |-
    Physical AI can perform increasingly diverse and complex tasks, yet reliable operation remains an open challenge. Drawing on work spanning deploying AI for Google Maps, Robot Soccer, Gravitational Wave Detection, Gemini Robotics, and industrial manipulation at Nomagic, I examine how simulation, large-scale physical data, and deployment contribute to this goal. Deployment provides three essential foundations: training experience generated through useful work, evaluation grounded in operational outcomes, and modular control systems that manage failures while learned models improve. Together, these foundations enable deployment to bootstrap both initial models and their development process. This argues for a mastery-first research agenda and connects practical deployment with fundamental questions surrounding imitation and reinforcement learning, targeted data collection, learned simulation, and efficient knowledge transfer.
  author-bio: |-
    Markus Wulfmeier is the Chief Scientist of Nomagic and a leading researcher in robotics, reinforcement learning, and physical AI. Previously a Staff Research Scientist at Google DeepMind, where he helped bridge advances in machine learning with real-world deployment.

    He received his Ph.D. from the University of Oxford, where he later conducted postdoctoral research and held visiting roles at UC Berkeley, MIT, and ETH Zurich. Dr. Wulfmeier has authored more than 50 publications, holds patents in machine learning and robotics, and his award-winning research has been featured in Wired, BBC, and 60 Minutes.
  date: Thursday / 8 October
  time: 17:00 - 18:00
  room: Hall B
  id: 5
