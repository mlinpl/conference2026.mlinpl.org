heading-image: "/images/mlinpl-conference-10th-edition-logo.png"
heading-image-alt: "ML in PL Conference 2026"
date-location: 8 - 11 October / Copernicus Science Centre, Warsaw, Poland

# Countdown settings
countdown-date: "2026-10-08T08:00:00"

# Shown instead of the countdown when state.after-conference is true
countdown-overwrite:
  # Post-event messages
  # These are automatically selected based on what content is available (see state.photos and state.aftermovie)
  post-event-message:
    default: 'Thank you for participating<br>and we hope to see you %next-year-link%next year!%/next-year-link%'
    with-photos: 'Thank you for participating!</br>Take a look at <a href="%baseurl%/photos">the photos <i class="fa-solid fa-camera-retro"></i></a><br>and we hope to see you %next-year-link%next year!%/next-year-link%'
    with-aftermovie: 'Thank you for participating!</br>Find the <a class="page-scroll" href="#aftermovie"> aftermovie and photos <i class="fa-solid fa-photo-film"></i></a> below<br>and we hope to see you %next-year-link%next year!%/next-year-link%'

# Primary call-to-action arrow destinations by conference phase
# Points to the most relevant section based on where we are in the conference timeline
arrow-destinations:
  default: "#about"              # Fallback (e.g. before ticket sales open, or after the conference without aftermovie)
  during-tickets: "#tickets"     # During ticket sales
  agenda-full: "#agenda"         # Once the full agenda is published
  after-event: "#aftermovie"     # After the conference, once the aftermovie is published (otherwise default)

# Meetup countdown settings
