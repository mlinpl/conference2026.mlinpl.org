- question: "Can everybody buy an Early Bird ticket?"
  answer: No, access to Early Bird tickets is preceded by a selective application process. Apply and see if you qualify!

- question: "How many people attend the ML in PL Conference each year?"
  answer: "Each year, around 700 people from academia and industry attend the conference."

- question: "What is the language of the conference?"
  answer: "All talks, tutorials, and materials are in English."

- question: "Can I serve as a reviewer?"
  answer: "No, unfortunately, we do not accept external reviewers as part of the review process."

- question: "Will the submitted papers be published in the post-conference proceedings?"
  answer: "No, ML in PL Conference is a non-archival conference. We only publish the submitted abstract and slides or poster on our website."

- question: "Can I present my work virtually?"
  answer: "No, all submitted works should be presented on-site."
