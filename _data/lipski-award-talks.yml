- author-name: Hubert Baniecki
  title: "Explainable Machine Intelligence"
  author-title: "University of Warsaw / Centre for Credible AI"
  abstract-md: |-
    I will briefly talk about explainable machine intelligence, the main topic of my research over the last six years. What began as a question about how humans interactively analyze models led me to investigate what an explanation actually measures, and ultimately to develop algorithms that make explanations more faithful to models and more robust to changes in data.
  author-bio: >-
    Hubert Baniecki is a PhD candidate at the University of Warsaw and a research assistant at the Centre for Credible AI. During his PhD, he interned at Meta in New York and was a visiting researcher at LMU Munich. His research focuses on machine learning interpretability, also known as explainable AI. He develops algorithms and tools to better understand how deep neural networks work, focusing on efficiently computing model explanations and applying them in medicine. His research has been published at NeurIPS, ICML, ICLR, as well as in JMLR and PNAS. He has received the FNP START Scholarship, the Minister’s Scholarship, the Pearls of Science grant, and the John M. Chambers Statistical Software Award.
  date: Friday / 9 October
  time: 15:00 - 15:30
  room: Main Hall
  session: Talks by Witold Lipski Award Laureates
  id: 2
  author-image: images/optimized/lipski-awards-600x600/HubertBaniecki.webp

- author-name: Michał Nauman
  title: "Scaling value-based reinforcement learning"
  author-title: "University of Warsaw / Nomagic"
  author-bio: >-
    Michał Nauman is an artificial intelligence researcher specializing in reinforcement learning. He completed his PhD at the University of Warsaw under the supervision of Marek Cygan, and was a visiting scholar at the University of California, Berkeley, working with Pieter Abbeel. His work has been published and recognized at leading AI conferences, including ICML, NeurIPS, and ICLR. His research focuses on scaling reinforcement learning for continuous control, with a particular interest in how learned policies generalize and transfer to new tasks.
  date: Friday / 9 October
