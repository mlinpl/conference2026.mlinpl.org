- author-name: Kamil Deja
  title: "When Prompting Is Not Enough: Precise Control Needs Precise Understanding"
  author-title: "Warsaw University of Technology / IDEAS Research Institute"
  abstract-md: |-
    Generative models such as diffusion models can create images, music, and video from text prompts. But prompts provide only coarse control. Small changes in wording can produce unpredictable changes in the output, while intermediate states of a concept are often difficult to express. In other domains, such as protein structure design, models are not conditioned on text at all, leaving no prompt to adjust.

    In this talk, I argue that precise control requires looking inside the model. I will discuss several of our recent papers that analyse where information is represented inside generative models and how these representations can be used for control. The emerging approach combining those ideas has three steps. First, we localize concepts (which turn out to be surprisingly well structured). Second, we interpret internal representations, decomposing activations into human-understandable features. Third, we steer generation by directly intervening in activation space.

    Across images, music, video, and protein structures, these studies show that internal representations provide a way to achieve fine-grained control that prompting alone cannot provide.
  author-bio: >-
    Kamil Deja is an Assistant Professor at the Warsaw University of Technology and Leader of the GenAI Team at the IDEAS Research Institute, where he bridges theoretical machine learning with interdisciplinary applications. He is also a member of the ELLIS Society. Building on his Ph.D. in generative modeling, he explores the potential of Diffusion Models across computer vision, audio synthesis, and scientific discovery, including High Energy Physics and protein design. His research experience includes visiting positions at Vrije Universiteit Amsterdam, Sapienza University and Amazon Alexa, as well as collaboration with the ALICE experiment at CERN. His current work focuses on some of the most pressing challenges in modern AI, particularly transparency and controllability, with an emphasis on mechanistic interpretability, model adaptation, and precise steering of generative processes.
  date: Friday / 9 October
  time: 14:30 - 15:00
  room: Main Hall
  session: Talks by Witold Lipski Award Laureates
  id: 1
